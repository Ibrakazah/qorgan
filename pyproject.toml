# Tool configuration only; dependencies live in requirements*.txt.
[project]
name = "ai-service"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Cyrillic text is intentional

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "evals", "scripts", "tests"]

[[tool.mypy.overrides]]
module = ["scripts.build_deck", "scripts.record_demo", "scripts.render_deck"]  # media tooling (pptx/playwright lack stubs), not the product
ignore_errors = true

[[tool.mypy.overrides]]
module = ["sklearn.*", "pandas.*", "pptx.*", "playwright.*"]
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"scripts/record_demo.py" = ["E501"]  # on-screen captions are long prose by design
